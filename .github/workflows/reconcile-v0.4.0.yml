name: Reconcile v0.4.0

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: reconcile-turnstile-v0.4.0
  cancel-in-progress: false

env:
  RAN_HISTORICAL_COMMIT: 89e9ef33dda3356c644ad094abafb1ac2faf63e0
  RAN_RELEASE_HEAD: 061aa2911ac8c610740553be5a4152a59072e12d
  RAN_RELEASE_TREE: 53bb06653e0f504e4b4547eb4d939de9a8083eba
  RAN_RELEASE_PR: '8'
  RAN_RELEASE_TAG: v0.4.0
  RAN_RELEASE_VERSION: 0.4.0

jobs:
  rebuild:
    name: Rebuild exact historical v0.4.0 source
    if: >-
      ${{ github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.path == '.github/workflows/quality.yml' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {}
    steps:
      - name: Check out exact historical source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$RAN_HISTORICAL_COMMIT" refs/remotes/origin/main
          git checkout --detach "$RAN_HISTORICAL_COMMIT"
          test "$(git rev-parse HEAD)" = "$RAN_HISTORICAL_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RAN_RELEASE_TREE"
          test "$(jq -er '.["."]' .release-please-manifest.json)" = "$RAN_RELEASE_VERSION"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2, wp-cli
          coverage: none

      - name: Qualify historical source and rebuild canonical assets
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          composer validate --strict
          composer run phpcs
          find . -path './vendor' -prune -o -type f -name '*.php' -exec php -l {} \;
          node --check assets/turnstile.js
          node --check scripts/make-pot.mjs
          node scripts/make-pot.mjs
          git diff --exit-code -- languages/ran-turnstile-for-jetpack-forms.pot

          bash scripts/create-release-assets.sh "$RAN_RELEASE_TAG"
          archive="dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip"
          checksum="${archive}.sha256"
          manifest="dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"

          jq -e \
            --arg archive "$(basename "$archive")" \
            --arg commit "$RAN_HISTORICAL_COMMIT" \
            --arg sha256 "$archive_sha256" \
            --arg tag "$RAN_RELEASE_TAG" \
            --arg version "$RAN_RELEASE_VERSION" \
            '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
            "$manifest" >/dev/null
          printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          unzip -tqq "$archive"

      - name: Upload exact historical reconciliation assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ran-turnstile-v0.4.0-reconciliation-${{ github.run_id }}
          path: |
            dist/ran-turnstile-for-jetpack-forms-0.4.0.zip
            dist/ran-turnstile-for-jetpack-forms-0.4.0.zip.sha256
            dist/ran-turnstile-for-jetpack-forms-0.4.0.manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  compatibility:
    name: Historical v0.4.0 / PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }} / Jetpack ${{ matrix.jetpack }}
    needs: rebuild
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wordpress: '6.5'
            jetpack: '13.3.1'
          - php: '8.5'
            wordpress: latest
            jetpack: latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out exact historical source without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$RAN_HISTORICAL_COMMIT" refs/remotes/origin/main
          git checkout --detach "$RAN_HISTORICAL_COMMIT"
          test "$(git rev-parse HEAD)" = "$RAN_HISTORICAL_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$RAN_RELEASE_TREE"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, zip
          tools: composer:v2, wp-cli

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download exact historical reconciliation assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0.4.0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Verify historical archive identity
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip"
          manifest="dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json"
          test "$(jq -er '.commit' "$manifest")" = "$RAN_HISTORICAL_COMMIT"
          test "$(jq -er '.tag' "$manifest")" = "$RAN_RELEASE_TAG"
          test "$(jq -er '.version' "$manifest")" = "$RAN_RELEASE_VERSION"
          (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
          unzip -tqq "$archive"

      - name: Install WordPress test suite
        run: bash scripts/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}

      - name: Run WordPress integration tests
        run: WP_TESTS_DIR=/tmp/wordpress-tests-lib composer run test

      - name: Install and activate historical release ZIP in fresh WordPress
        shell: bash
        run: |
          set -euo pipefail
          fresh_root="/tmp/ran-turnstile-v040-wordpress-${{ matrix.php }}"
          wp_version='${{ matrix.wordpress }}'
          if [[ "$wp_version" == latest ]]; then
            wp core download --path="$fresh_root"
          else
            wp core download --path="$fresh_root" --version="$wp_version"
          fi
          wp config create --path="$fresh_root" --dbname=ran_turnstile_v040 --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp db create --path="$fresh_root"
          wp core install --path="$fresh_root" --url=http://localhost --title='RAN Turnstile v0.4.0 reconciliation' --admin_user=admin --admin_password=reconciliation-test-password --admin_email=admin@example.test
          jetpack_version='${{ matrix.jetpack }}'
          if [[ "$jetpack_version" == latest ]]; then
            wp plugin install jetpack --path="$fresh_root" --activate
          else
            wp plugin install jetpack --version="$jetpack_version" --path="$fresh_root" --activate
          fi
          wp plugin install "$GITHUB_WORKSPACE/dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip" --path="$fresh_root" --activate
          wp plugin is-active ran-turnstile-for-jetpack-forms --path="$fresh_root"

  plugin-check:
    name: Historical v0.4.0 / Plugin Check
    needs: rebuild
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      PLUGIN_CHECK_CORE_REF: WordPress/WordPress#7.0.3
      PLUGIN_CHECK_SLUG: ran-turnstile-for-jetpack-forms
      PLUGIN_CHECK_WP_ENV_VERSION: 11.13.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify exact trusted tooling revision
        run: test "$(git rev-parse HEAD)" = '${{ github.event.workflow_run.head_sha }}'

      - name: Download exact historical reconciliation assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0.4.0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Extract historical release archive
        run: mkdir plugin-check-build && unzip -q "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip" -d plugin-check-build

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install pinned wp-env runtime
        run: |
          npm --global --no-fund --no-audit install "@wordpress/env@${PLUGIN_CHECK_WP_ENV_VERSION}"
          test "$(npm --global list @wordpress/env --depth=0 --json | jq -er '.dependencies["@wordpress/env"].version')" = "$PLUGIN_CHECK_WP_ENV_VERSION"

      - name: Configure pinned WordPress for Plugin Check
        env:
          PLUGIN_DIR: ${{ github.workspace }}/plugin-check-build/ran-turnstile-for-jetpack-forms
        run: |
          jq -n \
            --arg core "$PLUGIN_CHECK_CORE_REF" \
            --arg path "$PLUGIN_DIR" \
            --arg slug "$PLUGIN_CHECK_SLUG" \
            '{core: $core, port: 8880, testsEnvironment: false, mappings: {("wp-content/plugins/" + $slug): $path}}' > .wp-env.json
          test "$(jq -er '.core' .wp-env.json)" = "$PLUGIN_CHECK_CORE_REF"

      - name: Start pinned Plugin Check environment
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if wp-env start --update && wp-env run cli wp cli info; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            wp-env destroy --force || true
          done

      - name: Run Plugin Check and enforce scoped Turnstile acceptance
        timeout-minutes: 10
        env:
          RAW_RESULTS_FILE: ${{ runner.temp }}/plugin-check-results-raw.txt
          FILTERED_RESULTS_FILE: ${{ runner.temp }}/plugin-check-results-filtered.txt
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}/plugin-check-build/ran-turnstile-for-jetpack-forms
        run: |
          set -euo pipefail
          : > "$RAW_RESULTS_FILE"
          : > "$FILTERED_RESULTS_FILE"
          wp-env run cli wp plugin install plugin-check --activate
          dependencies="$(wp-env run cli wp plugin get "$PLUGIN_CHECK_SLUG" --field=requires_plugins | tr ',' ' ')"
          if [[ -n "$dependencies" ]]; then
            # WordPress owns these dependency slugs; word splitting is intentional.
            # shellcheck disable=SC2086
            wp-env run cli wp plugin install --activate $dependencies
          fi
          wp-env run cli wp plugin activate "$PLUGIN_CHECK_SLUG"

          set +e
          wp-env run cli wp plugin check "$PLUGIN_CHECK_SLUG" \
            --format=json \
            --require=./wp-content/plugins/plugin-check/cli.php > "$RAW_RESULTS_FILE"
          plugin_check_status=$?
          set -e
          cat "$RAW_RESULTS_FILE"
          if [[ "$plugin_check_status" -ne 0 && ! -s "$RAW_RESULTS_FILE" ]]; then
            exit "$plugin_check_status"
          fi

          log_token="$(openssl rand -hex 32)"
          printf '::stop-commands::%s\n' "$log_token"
          filter_status=0
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/scripts/filter-plugin-check-results.mjs,dst=/filter.mjs,readonly" \
            --mount "type=bind,src=$RAW_RESULTS_FILE,dst=/raw.txt,readonly" \
            --mount "type=bind,src=$PLUGIN_SOURCE_ROOT,dst=/source,readonly" \
            node:24-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e \
            node /filter.mjs /raw.txt - /source > "$FILTERED_RESULTS_FILE" || filter_status=$?
          printf '::%s::\n' "$log_token"
          cat "$FILTERED_RESULTS_FILE"
          exit "$filter_status"

      - name: Stop Plugin Check environment
        if: always()
        run: wp-env destroy --force || true

  publish:
    name: Publish and read back missing v0.4.0
    needs:
      - rebuild
      - compatibility
      - plugin-check
    if: >-
      ${{ always()
          && needs.rebuild.result == 'success'
          && needs.compatibility.result == 'success'
          && needs.plugin-check.result == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.path == '.github/workflows/quality.yml' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Download exact qualified historical assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0.4.0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Prove PR, commit, tree, manifest, and absent publication state
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main" = "$RAN_TRIGGER_SHA"

          release_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RAN_RELEASE_PR}")"
          jq -e \
            --arg merge "$RAN_HISTORICAL_COMMIT" \
            --arg head "$RAN_RELEASE_HEAD" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.merged_at != null
             and .base.ref == "main"
             and .head.sha == $head
             and .merge_commit_sha == $merge
             and .head.ref == "release-please--branches--main--components--ran-turnstile-for-jetpack-forms"
             and .head.repo.full_name == $repository
             and .user.login == "github-actions[bot]"' \
            <<< "$release_pr" >/dev/null
          labels="$(jq -c '[.labels[].name]' <<< "$release_pr")"
          jq -e 'index("autorelease: pending") != null and index("autorelease: tagged") == null' <<< "$labels" >/dev/null

          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${RAN_HISTORICAL_COMMIT}" --jq '.tree.sha')" = "$RAN_RELEASE_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${RAN_RELEASE_HEAD}" --jq '.tree.sha')" = "$RAN_RELEASE_TREE"
          manifest_version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${RAN_TRIGGER_SHA}" --jq '.content' | tr -d '\n' | base64 -d | jq -er '."."')"
          test "$manifest_version" = "$RAN_RELEASE_VERSION"

          archive="dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip"
          checksum="${archive}.sha256"
          manifest="dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          jq -e \
            --arg archive "$(basename "$archive")" \
            --arg commit "$RAN_HISTORICAL_COMMIT" \
            --arg sha256 "$archive_sha256" \
            --arg tag "$RAN_RELEASE_TAG" \
            --arg version "$RAN_RELEASE_VERSION" \
            '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
            "$manifest" >/dev/null
          printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          unzip -tqq "$archive"

          release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_match="$(jq -c --arg tag "$RAN_RELEASE_TAG" '[add | .[] | select(.tag_name == $tag)]' <<< "$release_pages")"
          tag_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/git/refs/tags?per_page=100")"
          tag_match="$(jq -c --arg ref "refs/tags/${RAN_RELEASE_TAG}" '[add | .[] | select(.ref == $ref)]' <<< "$tag_pages")"
          release_count="$(jq 'length' <<< "$release_match")"
          tag_count="$(jq 'length' <<< "$tag_match")"
          if [[ "$release_count" -eq 0 && "$tag_count" -eq 0 ]]; then
            echo 'state=absent' >> "$GITHUB_OUTPUT"
          elif [[ "$release_count" -eq 1 && "$tag_count" -eq 1 ]]; then
            echo 'state=existing' >> "$GITHUB_OUTPUT"
          else
            echo "::error::v0.4.0 has a partial tag/release state."
            exit 1
          fi

      - name: Create exact draft release when publication is absent
        id: create
        if: steps.identity.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(
            jq -nc \
              --arg tag "$RAN_RELEASE_TAG" \
              --arg target "$RAN_HISTORICAL_COMMIT" \
              '{tag_name: $tag, target_commitish: $target, name: $tag, draft: true, prerelease: false, generate_release_notes: true}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input -
          )"
          release_id="$(jq -er '.id' <<< "$release_json")"
          test "$(jq -er '.tag_name' <<< "$release_json")" = "$RAN_RELEASE_TAG"
          test "$(jq -er '.target_commitish' <<< "$release_json")" = "$RAN_HISTORICAL_COMMIT"
          test "$(jq -er '.draft' <<< "$release_json")" = true
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Attach exact qualified assets by immutable release ID
        if: steps.identity.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create.outputs.release-id }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
            "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256" \
            "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json"
          do
            asset_name="$(basename "$asset")"
            case "$asset_name" in
              *.zip) content_type='application/zip' ;;
              *.json) content_type='application/json' ;;
              *) content_type='application/octet-stream' ;;
            esac
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -H "Content-Type: ${content_type}" \
              --data-binary "@${asset}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${asset_name}" \
              >/dev/null
          done

      - name: Publish exact reconciled release
        if: steps.identity.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create.outputs.release-id }}
        run: |
          jq -nc '{draft: false, prerelease: false, make_latest: "true"}' \
            | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/dev/null

      - name: Read back exact tag, release, assets, and digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}")"
          release_id="$(jq -er '.id' <<< "$release_json")"
          jq -e \
            --arg tag "$RAN_RELEASE_TAG" \
            --arg commit "$RAN_HISTORICAL_COMMIT" \
            '.tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false' \
            <<< "$release_json" >/dev/null

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_RELEASE_TAG}")"
          jq -e --arg commit "$RAN_HISTORICAL_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref" >/dev/null

          expected_names="$(
            printf '%s\n' \
              "ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" \
              "ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
              "ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256" \
              | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
          )"
          test "$(jq -c '[.assets[].name] | sort' <<< "$release_json")" = "$expected_names"

          local_digests="$(
            for asset in \
              "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" \
              "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
              "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256"
            do
              jq -nc \
                --arg name "$(basename "$asset")" \
                --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" \
                '{name: $name, digest: $digest}'
            done | jq -sc 'sort_by(.name)'
          )"
          remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
          test "$remote_digests" = "$local_digests"

          printf 'release_id=%s\n' "$release_id"

      - name: Reconcile Release Please PR labels only after exact publication readback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}" --jq '[.labels[].name]')"
          if ! jq -e 'index("autorelease: tagged") != null' <<< "$labels" >/dev/null; then
            jq -nc '{labels: ["autorelease: tagged"]}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}/labels" --input - >/dev/null
          fi
          if jq -e 'index("autorelease: pending") != null' <<< "$labels" >/dev/null; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}/labels/autorelease%3A%20pending" >/dev/null
          fi
