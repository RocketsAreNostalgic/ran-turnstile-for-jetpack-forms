name: Migrate shared quality profile

on:
  push:
    branches:
      - chore/adopt-shared-quality-profile

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: chore/adopt-shared-quality-profile

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Add shared baseline and terminal fan-in
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/quality.yml')
          text = path.read_text()
          marker = 'jobs:\n'
          if text.count(marker) != 1:
              raise SystemExit('quality.yml jobs marker changed unexpectedly')
          if 'baseline:\n' in text or 'quality-gate:\n' in text:
              raise SystemExit('shared quality jobs already present')

          baseline = '''jobs:\n  baseline:\n    if: github.event_name == 'pull_request'\n    uses: RocketsAreNostalgic/.github/.github/workflows/quality-wordpress-plugin.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d\n    with:\n      php-version: '8.5'\n      node-version-file: .node-version\n      pnpm-version: '11.13.1'\n\n'''
          text = text.replace(marker, baseline, 1)

          dollar = '$'
          terminal = f'''\n\n  quality-gate:\n    if: always() && github.event_name == 'pull_request'\n    name: quality\n    needs:\n      - baseline\n      - quality\n      - compatibility\n      - plugin-check\n    runs-on: ubuntu-latest\n    steps:\n      - name: Require all ordinary quality lanes\n        run: |\n          test '{dollar}{{{{ needs.baseline.result }}}}' = success\n          test '{dollar}{{{{ needs.quality.result }}}}' = success\n          test '{dollar}{{{{ needs.compatibility.result }}}}' = success\n          test '{dollar}{{{{ needs.plugin-check.result }}}}' = success\n'''
          path.write_text(text.rstrip() + terminal)

      - name: Refresh only shared quality dependency locks
        run: |
          composer update \
            ran/coding-standards \
            phpcompatibility/php-compatibility \
            phpcompatibility/phpcompatibility-paragonie \
            phpcompatibility/phpcompatibility-wp \
            --with-dependencies \
            --no-interaction \
            --prefer-dist \
            --no-progress
          pnpm install --lockfile-only

      - name: Normalize bounded JavaScript surface
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/filter-plugin-check-results.test.mjs')
          text = path.read_text()
          old = """\treturn {\n\t\t...result,\n\t\toutput: stdout ? result.stdout : (fs.existsSync(output) ? fs.readFileSync(output, 'utf8') : ''),\n\t};"""
          new = """\tlet outputText = '';\n\tif (stdout) {\n\t\toutputText = result.stdout;\n\t} else if (fs.existsSync(output)) {\n\t\toutputText = fs.readFileSync(output, 'utf8');\n\t}\n\n\treturn {\n\t\t...result,\n\t\toutput: outputText,\n\t};"""
          if text.count(old) != 1:
              raise SystemExit('expected nested ternary test block changed unexpectedly')
          path.write_text(text.replace(old, new, 1))

      - name: Apply shared formatter to exact Node quality surface
        run: |
          pnpm exec prettier --write \
            assets/turnstile.js \
            .github/scripts/filter-plugin-check-results.mjs \
            .github/scripts/filter-plugin-check-results.test.mjs \
            eslint.config.mjs \
            prettier.config.cjs \
            package.json \
            pnpm-workspace.yaml

      - name: Prove generated locks and Node contract exactly
        run: |
          rm -rf vendor node_modules
          composer install --no-interaction --prefer-dist --no-progress
          pnpm install --frozen-lockfile
          pnpm peers check
          composer check
          pnpm check
          node --check assets/turnstile.js
          node --check scripts/make-pot.mjs
          node --check .github/scripts/filter-plugin-check-results.mjs
          node --test .github/scripts/filter-plugin-check-results.test.mjs

      - name: Materialize proven permanent workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          quality_blob="$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -F content=@.github/workflows/quality.yml \
            -f encoding=utf-8 \
            --jq '.sha')"
          test -n "$quality_blob"
          printf 'PERMANENT_QUALITY_BLOB=%s\n' "$quality_blob"

      - name: Confirm proven branch artifacts are already materialized
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          git restore .github/workflows/quality.yml
          test -z "$(git status --short)"
