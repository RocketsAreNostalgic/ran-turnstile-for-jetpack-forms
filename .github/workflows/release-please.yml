name: Release Please

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z GitHub release tag to rebuild
        required: true
        type: string
      deploy:
        description: Request a protected WordPress.org deployment
        required: true
        default: false
        type: boolean
      sync_assets:
        description: Deliberately sync listing artwork to SVN /assets
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: >-
      ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      deployment_enabled: ${{ steps.contract.outputs.enabled }}
      published_now: ${{ steps.publish.outputs.published-now }}
      tag_name: ${{ steps.release-state.outputs.tag-name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prove an exact merged Release Please candidate before publication
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAN_QUALITY_COMMIT"
          if git diff --quiet "${RAN_QUALITY_COMMIT}^1" "$RAN_QUALITY_COMMIT" -- .release-please-manifest.json; then echo 'release-required=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          release_commit="$(git rev-parse "${RAN_QUALITY_COMMIT}^2")"
          test "$(git log -1 --format=%H "$RAN_QUALITY_COMMIT" -- .release-please-manifest.json)" = "$release_commit"
          test "$(git rev-parse "${RAN_QUALITY_COMMIT}^{tree}")" = "$(git rev-parse "${release_commit}^{tree}")"
          version="$(jq -er '."." | select(type == "string")' .release-please-manifest.json)"
          tag="v${version}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          release_pr="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${release_commit}/pulls" | jq -cer --arg merge "$RAN_QUALITY_COMMIT" --arg release "$release_commit" --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.merged_at != null and .base.ref == "main" and .head.sha == $release and .merge_commit_sha == $merge and .head.ref == "release-please--branches--main--components--ran-turnstile-for-jetpack-forms" and .head.repo.full_name == $repository and .user.login == "github-actions[bot]")] | if length == 1 then .[0] else error("Expected exactly one merged Release Please PR for the Quality commit.") end')"
          release_pr_number="$(jq -er '.number' <<< "$release_pr")"
          pending="$(jq -r 'any(.labels[]?; .name == "autorelease: pending")' <<< "$release_pr")"
          tagged="$(jq -r 'any(.labels[]?; .name == "autorelease: tagged")' <<< "$release_pr")"
          release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          if release_json="$(jq -cer --arg tag "$tag" 'add | .[] | select(.tag_name == $tag)' <<< "$release_pages")"; then
            test "$(jq -er '.target_commitish' <<< "$release_json")" = "$RAN_QUALITY_COMMIT"
            if [[ "$(jq -er '.draft' <<< "$release_json")" == false ]]; then state=published; release_pending=false; else state=draft; release_pending=true; fi
          else state=absent; release_pending=true; fi
          if [[ "$release_pending" == true ]]; then test "$pending" = true; test "$tagged" = false; elif [[ "$pending" != true && "$tagged" != true ]]; then echo '::error::The published release PR has neither the pending nor tagged Release Please label.'; exit 1; fi
          printf 'release-required=true\ntag-name=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'RAN_RELEASE_PENDING=%s\nRAN_RELEASE_PR_NUMBER=%s\nRAN_RELEASE_STATE=%s\nRAN_RELEASE_TAG=%s\nRAN_RELEASE_VERSION=%s\n' "$release_pending" "$release_pr_number" "$state" "$tag" "$version" >> "$GITHUB_ENV"

      - name: Open or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Download the exact assets tested by Quality
        if: steps.release-state.outputs.release-required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-for-jetpack-forms-release-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify the downloaded release identity
        if: steps.release-state.outputs.release-required == 'true'
        env:
          RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          archive="dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip"; checksum="${archive}.sha256"; manifest="dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json"
          jq -e --arg archive "$(basename "$archive")" --arg commit "$RAN_QUALITY_COMMIT" --arg tag "$RAN_RELEASE_TAG" --arg version "$RAN_RELEASE_VERSION" '.archive == $archive and .commit == $commit and .tag == $tag and .version == $version and (.sha256 | test("^[0-9a-f]{64}$"))' "$manifest" >/dev/null
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          unzip -tqq "$archive"

      - name: Create a draft, attach the tested assets, and publish
        id: publish
        if: steps.release-state.outputs.release-required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo 'published-now=false' >> "$GITHUB_OUTPUT"
          if [[ "$RAN_RELEASE_PENDING" != true ]]; then exit 0; fi
          if [[ "$RAN_RELEASE_STATE" == absent ]]; then prerelease=(); [[ "$RAN_RELEASE_VERSION" == *-* ]] && prerelease=(--prerelease); gh release create "$RAN_RELEASE_TAG" --draft --target "$RAN_QUALITY_COMMIT" --title "$RAN_RELEASE_TAG" --generate-notes "${prerelease[@]}"; fi
          gh release upload "$RAN_RELEASE_TAG" "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip" "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256" "dist/ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" --clobber --repo "$GITHUB_REPOSITORY"
          latest=(--latest); [[ "$RAN_RELEASE_VERSION" == *-* ]] && latest=(--prerelease)
          gh release edit "$RAN_RELEASE_TAG" --draft=false "${latest[@]}"
          echo 'published-now=true' >> "$GITHUB_OUTPUT"

      - name: Read back the published release and reconcile its exact PR
        if: steps.release-state.outputs.release-required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}")"
          jq -e --arg tag "$RAN_RELEASE_TAG" --arg commit "$RAN_QUALITY_COMMIT" '.tag_name == $tag and .draft == false and .target_commitish == $commit' <<< "$release_json" >/dev/null
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_RELEASE_TAG}")"; jq -e --arg commit "$RAN_QUALITY_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref" >/dev/null
          expected="$(printf '%s\n' "ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" "ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip" "ran-turnstile-for-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256" | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"; test "$(jq -c '[.assets[].name] | sort' <<< "$release_json")" = "$expected"
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR_NUMBER}" --jq '[.labels[].name]')"
          if ! jq -e 'index("autorelease: tagged") != null' <<< "$labels" >/dev/null; then jq -nc '{labels: ["autorelease: tagged"]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR_NUMBER}/labels" --input - >/dev/null; fi
          if jq -e 'index("autorelease: pending") != null' <<< "$labels" >/dev/null; then gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR_NUMBER}/labels/autorelease%3A%20pending" >/dev/null; fi

      - name: Read deployment contract
        id: contract
        if: steps.release-state.outputs.release-required == 'true'
        run: echo "enabled=$(jq -r '.enabled' wordpress-org/deployment.json)" >> "$GITHUB_OUTPUT"

  package-release:
    name: Manually rebuild an existing release
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    env:
      TAG_NAME: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.TAG_NAME }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        id: php
        continue-on-error: true
        timeout-minutes: 3
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2, wp-cli
          coverage: none
      - name: Retry the bounded PHP setup once
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        timeout-minutes: 3
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2, wp-cli
          coverage: none
      - run: |
          composer install --no-interaction --prefer-dist
          composer validate --strict
          composer run phpcs
          find . -path './vendor' -prune -o -type f -name '*.php' -exec php -l {} \;
          node --check assets/turnstile.js
          node --check scripts/make-pot.mjs
          node scripts/make-pot.mjs
          git diff --exit-code -- languages/ran-turnstile-for-jetpack-forms.pot

      - name: Prove the exact existing release before recovery
        id: recovery-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          [[ "$TAG_NAME" == "v${version}" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "${TAG_NAME}^{commit}")" = "$commit"

          archive="ran-turnstile-for-jetpack-forms-${version}.zip"
          checksum="${archive}.sha256"
          manifest="ran-turnstile-for-jetpack-forms-${version}.manifest.json"
          expected="$(printf '%s\n' "$manifest" "$archive" "$checksum" | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"
          jq -e --arg commit "$commit" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref" >/dev/null
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"
          jq -e --arg commit "$commit" --arg tag "$TAG_NAME" '.tag_name == $tag and .target_commitish == $commit and .draft == false and .immutable == false' <<< "$release" >/dev/null
          jq -e --argjson expected "$expected" '([.assets[].name] - $expected) | length == 0' <<< "$release" >/dev/null

          {
            printf 'commit=%s\n' "$commit"
            printf 'release-id=%s\n' "$(jq -er '.id' <<< "$release")"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Rebuild canonical assets without release credentials
        run: env -u GH_TOKEN -u GITHUB_TOKEN bash scripts/create-release-assets.sh "$TAG_NAME"

      - name: Replace and read back exact release assets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_RECOVERY_COMMIT: ${{ steps.recovery-state.outputs.commit }}
          RAN_RECOVERY_RELEASE_ID: ${{ steps.recovery-state.outputs.release-id }}
          RAN_RECOVERY_VERSION: ${{ steps.recovery-state.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAN_RECOVERY_COMMIT"
          test "$(git rev-parse "${TAG_NAME}^{commit}")" = "$RAN_RECOVERY_COMMIT"

          archive="dist/ran-turnstile-for-jetpack-forms-${RAN_RECOVERY_VERSION}.zip"
          checksum="${archive}.sha256"
          manifest="dist/ran-turnstile-for-jetpack-forms-${RAN_RECOVERY_VERSION}.manifest.json"
          expected="$(printf '%s\n' "$(basename "$manifest")" "$(basename "$archive")" "$(basename "$checksum")" | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"

          tag_ref_before="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"
          jq -e --arg commit "$RAN_RECOVERY_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref_before" >/dev/null
          release_before="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"
          jq -e --arg commit "$RAN_RECOVERY_COMMIT" --argjson release_id "$RAN_RECOVERY_RELEASE_ID" --arg tag "$TAG_NAME" '.id == $release_id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .immutable == false' <<< "$release_before" >/dev/null
          jq -e --argjson expected "$expected" '([.assets[].name] - $expected) | length == 0' <<< "$release_before" >/dev/null

          manifest_sha256="$(jq -er '.sha256 | select(test("^[0-9a-f]{64}$"))' "$manifest")"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          test "$manifest_sha256" = "$archive_sha256"
          jq -e --arg archive "$(basename "$archive")" --arg commit "$RAN_RECOVERY_COMMIT" --arg sha256 "$archive_sha256" --arg tag "$TAG_NAME" --arg version "$RAN_RECOVERY_VERSION" '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' "$manifest" >/dev/null
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          unzip -tqq "$archive"

          assets=("$archive" "$checksum" "$manifest")
          local_digests="$(for asset in "${assets[@]}"; do jq -nc --arg name "$(basename "$asset")" --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" '{name: $name, digest: $digest}'; done | jq -sc 'sort_by(.name)')"

          set +e
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          upload_status=$?
          set -e

          verified=false
          for attempt in 1 2 3; do
            if release_after="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")" \
              && tag_ref_after="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"; then
              if jq -e --arg commit "$RAN_RECOVERY_COMMIT" --argjson release_id "$RAN_RECOVERY_RELEASE_ID" --arg tag "$TAG_NAME" '.id == $release_id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .immutable == false' <<< "$release_after" >/dev/null \
                && jq -e --arg commit "$RAN_RECOVERY_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref_after" >/dev/null; then
                actual_assets="$(jq -c '[.assets[].name] | sort' <<< "$release_after")"
                remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_after")"
                if [[ "$actual_assets" == "$expected" && "$remote_digests" == "$local_digests" ]]; then
                  verified=true
                  break
                fi
              fi
            fi
            [[ "$attempt" -lt 3 ]] && sleep 2
          done

          if [[ "$verified" != true ]]; then
            echo '::error::Recovered release readback did not match the rebuilt provenance.'
            exit 1
          fi
          if [[ "$upload_status" -ne 0 ]]; then
            echo "::error::Asset upload returned status ${upload_status} even though final readback was exact."
            exit "$upload_status"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  deploy-wordpress-org:
    name: Deploy to WordPress.org
    needs: [release-please, package-release]
    if: >-
      ${{ always() && ((github.event_name == 'workflow_run' && needs.release-please.result == 'success' && needs.release-please.outputs.published_now == 'true' && needs.release-please.outputs.deployment_enabled == 'true') || (github.event_name == 'workflow_dispatch' && needs.package-release.result == 'success' && inputs.deploy)) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    environment: wordpress-org
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && needs.package-release.outputs.tag_name || needs.release-please.outputs.tag_name }}
      WORDPRESS_ORG_USERNAME: ${{ secrets.WORDPRESS_ORG_USERNAME }}
      WORDPRESS_ORG_PASSWORD: ${{ secrets.WORDPRESS_ORG_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.TAG_NAME }}
      - name: Download canonical GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG_NAME#v}"; mkdir -p dist
          gh release download "$TAG_NAME" --pattern "ran-turnstile-for-jetpack-forms-${version}.*" --dir dist --repo "$GITHUB_REPOSITORY"
      - name: Deploy verified release to protected SVN
        run: |
          version="${TAG_NAME#v}"; options=()
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && options+=(--allow-disabled)
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && '${{ inputs.sync_assets }}' == true ]] && options+=(--sync-assets)
          bash scripts/deploy-wordpress-org.sh "dist/ran-turnstile-for-jetpack-forms-${version}.zip" "dist/ran-turnstile-for-jetpack-forms-${version}.zip.sha256" "dist/ran-turnstile-for-jetpack-forms-${version}.manifest.json" "${options[@]}"
