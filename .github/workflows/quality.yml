name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality and release artifact
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      artifact-name: ${{ steps.release.outputs.artifact-name }}
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      # setup-php can stall indefinitely mid-provision when an upstream package
      # fetch hangs, so bound each attempt and retry once on a fresh process.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        id: php
        continue-on-error: true
        timeout-minutes: 3
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip
          tools: composer:v2, wp-cli

      - name: Retry the bounded PHP setup once
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        timeout-minutes: 3
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip
          tools: composer:v2, wp-cli

      - name: Install PHP development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run cheap source and generated-file gates
        run: |
          composer validate --strict
          composer run phpcs
          find . -path './vendor' -prune -o -type f -name '*.php' -exec php -l {} \;
          node --check assets/turnstile.js
          node --check scripts/make-pot.mjs
          node --check .github/scripts/filter-plugin-check-results.mjs
          node --test .github/scripts/filter-plugin-check-results.test.mjs
          node scripts/make-pot.mjs
          git diff --exit-code -- languages/ran-turnstile-for-jetpack-forms.pot
          grep -Fq 'tools: composer:v2, wp-cli' .github/workflows/quality.yml
          grep -Fq "github.event_name == 'pull_request'" .github/workflows/quality.yml
          # These single-quoted patterns are literal workflow contracts.
          # shellcheck disable=SC2016
          grep -Fq 'git log -1 --format=%H "$RAN_QUALITY_COMMIT" -- .release-please-manifest.json' .github/workflows/release-please.yml
          # shellcheck disable=SC2016
          grep -Fq 'git rev-parse "${RAN_QUALITY_COMMIT}^{tree}"' .github/workflows/release-please.yml

      - name: Build and verify the canonical release assets once
        id: release
        shell: bash
        env:
          RAN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RAN_PR_BASE: ${{ github.event.pull_request.base.ref }}
          RAN_PR_HEAD: ${{ github.event.pull_request.head.ref }}
          RAN_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' ran-turnstile-for-jetpack-forms.php)"
          test -n "$version"
          bash scripts/create-release-assets.sh "v${version}"

          release_candidate=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request \
              && "$RAN_PR_AUTHOR" == 'github-actions[bot]' \
              && "$RAN_PR_BASE" == main \
              && "$RAN_PR_HEAD" == 'release-please--branches--main--components--ran-turnstile-for-jetpack-forms' \
              && "$RAN_PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
              release_candidate=true
          fi

          if [[ "$release_candidate" == true ]]; then
              matrix='{"include":[{"php":"8.5","wordpress":"latest","jetpack":"latest"}]}'
          else
              matrix='{"include":[{"php":"8.0","wordpress":"6.5","jetpack":"13.3.1"},{"php":"8.5","wordpress":"latest","jetpack":"latest"}]}'
          fi

          {
              printf 'artifact-name=ran-turnstile-for-jetpack-forms-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
              printf 'matrix=%s\n' "$matrix"
              printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact-name }}
          path: |
            dist/ran-turnstile-for-jetpack-forms-${{ steps.release.outputs.version }}.zip
            dist/ran-turnstile-for-jetpack-forms-${{ steps.release.outputs.version }}.zip.sha256
            dist/ran-turnstile-for-jetpack-forms-${{ steps.release.outputs.version }}.manifest.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }} / Jetpack ${{ matrix.jetpack }}
    needs: quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        id: php
        continue-on-error: true
        timeout-minutes: 3
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, zip
          tools: composer:v2, wp-cli

      - name: Retry the bounded PHP setup once
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        timeout-minutes: 3
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, zip
          tools: composer:v2, wp-cli

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download the canonical release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.quality.outputs.artifact-name }}
          path: dist

      - name: Verify the shared archive identity
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/ran-turnstile-for-jetpack-forms-${{ needs.quality.outputs.version }}.zip"
          manifest="dist/ran-turnstile-for-jetpack-forms-${{ needs.quality.outputs.version }}.manifest.json"
          test "$(jq -er '.commit' "$manifest")" = "$GITHUB_SHA"
          test "$(jq -er '.version' "$manifest")" = '${{ needs.quality.outputs.version }}'
          (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
          unzip -tqq "$archive"

      - name: Install WordPress test suite
        run: bash scripts/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}

      - name: Run WordPress integration tests
        run: WP_TESTS_DIR=/tmp/wordpress-tests-lib composer run test

      - name: Install and activate the shared release ZIP in fresh WordPress
        run: |
          fresh_root="/tmp/ran-turnstile-release-wordpress-${{ matrix.php }}"
          wp_version='${{ matrix.wordpress }}'
          if [[ "$wp_version" == latest ]]; then
              wp core download --path="$fresh_root"
          else
              wp core download --path="$fresh_root" --version="$wp_version"
          fi
          wp config create --path="$fresh_root" --dbname=ran_turnstile_release --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp db create --path="$fresh_root"
          wp core install --path="$fresh_root" --url=http://localhost --title='RAN Turnstile release test' --admin_user=admin --admin_password=release-test-password --admin_email=admin@example.test
          jetpack_version='${{ matrix.jetpack }}'
          if [[ "$jetpack_version" == latest ]]; then
              wp plugin install jetpack --path="$fresh_root" --activate
          else
              wp plugin install jetpack --version="$jetpack_version" --path="$fresh_root" --activate
          fi
          wp plugin install "$GITHUB_WORKSPACE/dist/ran-turnstile-for-jetpack-forms-${{ needs.quality.outputs.version }}.zip" --path="$fresh_root" --activate
          wp plugin is-active ran-turnstile-for-jetpack-forms --path="$fresh_root"

  plugin-check:
    name: Plugin Check
    needs: quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      PLUGIN_CHECK_CORE_REF: WordPress/WordPress#7.0.3
      PLUGIN_CHECK_SLUG: ran-turnstile-for-jetpack-forms
      PLUGIN_CHECK_WP_ENV_VERSION: 11.13.0
    steps:
      - name: Initialize Plugin Check evidence files
        run: |
          : > "${{ runner.temp }}/plugin-check-results-raw.txt"
          : > "${{ runner.temp }}/plugin-check-results-filtered.txt"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the canonical release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.quality.outputs.artifact-name }}
          path: dist

      - name: Extract the tested archive
        run: mkdir plugin-check-build && unzip -q "dist/ran-turnstile-for-jetpack-forms-${{ needs.quality.outputs.version }}.zip" -d plugin-check-build

      # WordPress.org can advertise a release before its matching Git mirror
      # tag exists. Pin both wp-env and Core so Plugin Check remains releasable
      # during that propagation window.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install the pinned wp-env runtime
        run: |
          npm --global --no-fund --no-audit install "@wordpress/env@${PLUGIN_CHECK_WP_ENV_VERSION}"
          test "$(npm --global list @wordpress/env --depth=0 --json | jq -er '.dependencies["@wordpress/env"].version')" = "$PLUGIN_CHECK_WP_ENV_VERSION"

      - name: Configure WordPress 7.0.3 for Plugin Check
        env:
          PLUGIN_DIR: ${{ github.workspace }}/plugin-check-build/ran-turnstile-for-jetpack-forms
        run: |
          jq -n \
            --arg core "$PLUGIN_CHECK_CORE_REF" \
            --arg path "$PLUGIN_DIR" \
            --arg slug "$PLUGIN_CHECK_SLUG" \
            '{core: $core, port: 8880, testsEnvironment: false, mappings: {("wp-content/plugins/" + $slug): $path}}' > .wp-env.json
          test "$(jq -er '.core' .wp-env.json)" = "$PLUGIN_CHECK_CORE_REF"

      - name: Start the pinned Plugin Check environment
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
              if wp-env start --update && wp-env run cli wp cli info; then
                  exit 0
              fi
              if [[ "$attempt" == 3 ]]; then
                  exit 1
              fi
              wp-env destroy --force || true
          done

      - name: Run Plugin Check and enforce scoped Turnstile acceptance
        timeout-minutes: 10
        env:
          RAW_RESULTS_FILE: ${{ runner.temp }}/plugin-check-results-raw.txt
          FILTERED_RESULTS_FILE: ${{ runner.temp }}/plugin-check-results-filtered.txt
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}/plugin-check-build/ran-turnstile-for-jetpack-forms
        run: |
          set -euo pipefail
          wp-env run cli wp plugin install plugin-check --activate
          dependencies="$(wp-env run cli wp plugin get "$PLUGIN_CHECK_SLUG" --field=requires_plugins | tr ',' ' ')"
          if [[ -n "$dependencies" ]]; then
              # WordPress owns these dependency slugs; word splitting is intentional.
              # shellcheck disable=SC2086
              wp-env run cli wp plugin install --activate $dependencies
          fi
          wp-env run cli wp plugin activate "$PLUGIN_CHECK_SLUG"

          set +e
          wp-env run cli wp plugin check "$PLUGIN_CHECK_SLUG" \
            --format=json \
            --require=./wp-content/plugins/plugin-check/cli.php > "$RAW_RESULTS_FILE"
          plugin_check_status=$?
          set -e

          cat "$RAW_RESULTS_FILE"
          if [[ "$plugin_check_status" -ne 0 && ! -s "$RAW_RESULTS_FILE" ]]; then
              exit "$plugin_check_status"
          fi

          # PR code gets only read-only inputs, no host workspace, credentials,
          # network, or Docker socket. Only stdout becomes the filtered artifact.
          log_token="$(openssl rand -hex 32)"
          printf '::stop-commands::%s\n' "$log_token"
          filter_status=0
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/scripts/filter-plugin-check-results.mjs,dst=/filter.mjs,readonly" \
            --mount "type=bind,src=$RAW_RESULTS_FILE,dst=/raw.txt,readonly" \
            --mount "type=bind,src=$PLUGIN_SOURCE_ROOT,dst=/source,readonly" \
            node:24-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e \
            node /filter.mjs /raw.txt - /source > "$FILTERED_RESULTS_FILE" || filter_status=$?
          printf '::%s::\n' "$log_token"
          exit "$filter_status"

      - name: Upload Plugin Check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-check-results
          path: |
            ${{ runner.temp }}/plugin-check-results-raw.txt
            ${{ runner.temp }}/plugin-check-results-filtered.txt
          if-no-files-found: error

      - name: Destroy the pinned Plugin Check environment
        if: always()
        run: wp-env destroy --force || true
