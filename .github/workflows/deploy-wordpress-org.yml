name: WordPress.org Deployment

on:
  workflow_run:
    workflows: [Release Please]
    types: [completed]
    branches: [main]

concurrency:
  group: wordpress-org-deployment
  cancel-in-progress: false

permissions: {}

jobs:
  contract:
    name: Resolve exact immutable GitHub release
    if: >-
      ${{
        github.event.workflow_run.event == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.head_repository.id == github.repository_id
        && github.event.workflow_run.path == '.github/workflows/release-please.yml'
      }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      deploy-required: ${{ steps.release.outputs.deploy-required }}
      enabled: ${{ steps.contract.outputs.enabled }}
      sync-assets: ${{ steps.contract.outputs.sync-assets }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Resolve exact immutable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_ADMITTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAN_ADMITTED_SHA"
          release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          matches="$(jq -cer --arg sha "$RAN_ADMITTED_SHA" 'add | [.[] | select(.target_commitish == $sha and .draft == false and .immutable == true)]' <<< "$release_pages")"
          count="$(jq -er 'length' <<< "$matches")"
          if [[ "$count" == 0 ]]; then echo 'deploy-required=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          test "$count" == 1
          tag="$(jq -er '.[0].tag_name' <<< "$matches")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
          jq -e --arg sha "$RAN_ADMITTED_SHA" '.object.type == "commit" and .object.sha == $sha' <<< "$tag_ref" >/dev/null
          printf 'deploy-required=true\ntag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Read committed deployment contract
        id: contract
        if: ${{ steps.release.outputs.deploy-required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '(.enabled | type == "boolean") and ((.syncListingAssets // false) | type == "boolean")' wordpress-org/deployment.json >/dev/null
          printf 'enabled=%s\nsync-assets=%s\n' "$(jq -r '.enabled' wordpress-org/deployment.json)" "$(jq -r '.syncListingAssets // false' wordpress-org/deployment.json)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy exact GitHub release to WordPress.org
    needs: contract
    if: ${{ needs.contract.outputs.deploy-required == 'true' && needs.contract.outputs.enabled == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    environment: wordpress-org
    env:
      ADMITTED_SHA: ${{ github.event.workflow_run.head_sha }}
      TAG_NAME: ${{ needs.contract.outputs.tag }}
      SYNC_LISTING_ASSETS: ${{ needs.contract.outputs.sync-assets }}
      WORDPRESS_ORG_USERNAME: ${{ secrets.WORDPRESS_ORG_USERNAME }}
      WORDPRESS_ORG_PASSWORD: ${{ secrets.WORDPRESS_ORG_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.TAG_NAME }}
      - name: Download and verify exact immutable GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_SHA"
          version="${TAG_NAME#v}"
          archive="ran-turnstile-for-jetpack-forms-${version}.zip"
          checksum="${archive}.sha256"
          manifest="ran-turnstile-for-jetpack-forms-${version}.manifest.json"
          mkdir -p dist
          for asset in "$archive" "$checksum" "$manifest"; do gh release download "$TAG_NAME" --pattern "$asset" --dir dist --repo "$GITHUB_REPOSITORY"; done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"
          jq -e --arg commit "$ADMITTED_SHA" --arg tag "$TAG_NAME" '.tag_name == $tag and .target_commitish == $commit and .draft == false and .immutable == true' <<< "$release_json" >/dev/null
          expected="$(printf '%s\n' "$archive" "$checksum" "$manifest" | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
          test "$(jq -c '[.assets[].name] | sort' <<< "$release_json")" = "$expected"
          for name in "$archive" "$checksum" "$manifest"; do
            local_digest="sha256:$(sha256sum "dist/${name}" | awk '{ print $1 }')"
            remote_digest="$(jq -er --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0].digest else error("Expected one exact release asset.") end' <<< "$release_json")"
            test "$local_digest" = "$remote_digest"
          done
          (cd dist && sha256sum --check --strict "$checksum")
      - name: Deploy verified immutable release to protected SVN
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          options=()
          [[ "$SYNC_LISTING_ASSETS" == true ]] && options+=(--sync-assets)
          bash scripts/deploy-wordpress-org.sh "dist/ran-turnstile-for-jetpack-forms-${version}.zip" "dist/ran-turnstile-for-jetpack-forms-${version}.zip.sha256" "dist/ran-turnstile-for-jetpack-forms-${version}.manifest.json" "${options[@]}"
