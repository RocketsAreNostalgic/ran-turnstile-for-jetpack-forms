name: Reconcile v0.4.0 publication

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: reconcile-v0-4-0-publication
  cancel-in-progress: false

env:
  TAG_NAME: v0.4.0
  VERSION: 0.4.0
  SOURCE_COMMIT: 89e9ef33dda3356c644ad094abafb1ac2faf63e0
  RELEASE_PR: '8'
  RELEASE_PR_HEAD: 061aa2911ac8c610740553be5a4152a59072e12d

jobs:
  build:
    name: Rebuild exact v0.4.0 source
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.path == '.github/workflows/quality.yml' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {}
    steps:
      - name: Check out the exact historical merge without repository credentials
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(jq -er '."."' .release-please-manifest.json)" = "$VERSION"
          test "$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' ran-turnstile-for-jetpack-forms.php)" = "$VERSION"
          test "$(jq -er '.enabled' wordpress-org/deployment.json)" = false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        id: php
        continue-on-error: true
        timeout-minutes: 3
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2, wp-cli
          coverage: none

      - name: Retry the bounded PHP setup once
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        timeout-minutes: 3
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2, wp-cli
          coverage: none

      - name: Requalify historical source and build canonical assets
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          composer validate --strict
          composer run phpcs
          find . -path './vendor' -prune -o -type f -name '*.php' -exec php -l {} \;
          node --check assets/turnstile.js
          node --check scripts/make-pot.mjs
          node scripts/make-pot.mjs
          git diff --exit-code -- languages/ran-turnstile-for-jetpack-forms.pot

          bash scripts/create-release-assets.sh "$TAG_NAME"
          archive="dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip"
          checksum="${archive}.sha256"
          manifest="dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"

          jq -e \
            --arg archive "$(basename "$archive")" \
            --arg commit "$SOURCE_COMMIT" \
            --arg sha256 "$archive_sha256" \
            --arg tag "$TAG_NAME" \
            --arg version "$VERSION" \
            '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
            "$manifest" >/dev/null
          printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          unzip -tqq "$archive"

      - name: Upload exact reconciliation assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ran-turnstile-v0-4-0-reconciliation-${{ github.run_id }}
          path: |
            dist/ran-turnstile-for-jetpack-forms-0.4.0.zip
            dist/ran-turnstile-for-jetpack-forms-0.4.0.zip.sha256
            dist/ran-turnstile-for-jetpack-forms-0.4.0.manifest.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }} / Jetpack ${{ matrix.jetpack }}
    needs: build
    if: needs.build.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wordpress: '6.5'
            jetpack: '13.3.1'
          - php: '8.5'
            wordpress: latest
            jetpack: latest
    steps:
      - name: Check out exact historical source without repository credentials
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        id: php
        continue-on-error: true
        timeout-minutes: 3
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, zip
          tools: composer:v2, wp-cli

      - name: Retry the bounded PHP setup once
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        timeout-minutes: 3
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, zip
          tools: composer:v2, wp-cli

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download the exact rebuilt release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0-4-0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Verify historical archive identity
        run: |
          set -euo pipefail
          archive="dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip"
          manifest="dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json"
          test "$(jq -er '.commit' "$manifest")" = "$SOURCE_COMMIT"
          test "$(jq -er '.version' "$manifest")" = "$VERSION"
          test "$(jq -er '.tag' "$manifest")" = "$TAG_NAME"
          (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
          unzip -tqq "$archive"

      - name: Install WordPress test suite
        run: bash scripts/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}

      - name: Run WordPress integration tests
        run: WP_TESTS_DIR=/tmp/wordpress-tests-lib composer run test

      - name: Install and activate the rebuilt release ZIP in fresh WordPress
        run: |
          fresh_root="/tmp/ran-turnstile-v0-4-0-${{ matrix.php }}"
          wp_version='${{ matrix.wordpress }}'
          if [[ "$wp_version" == latest ]]; then
            wp core download --path="$fresh_root"
          else
            wp core download --path="$fresh_root" --version="$wp_version"
          fi
          wp config create --path="$fresh_root" --dbname=ran_turnstile_reconcile --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp db create --path="$fresh_root"
          wp core install --path="$fresh_root" --url=http://localhost --title='RAN Turnstile v0.4.0 reconciliation' --admin_user=admin --admin_password=release-test-password --admin_email=admin@example.test
          jetpack_version='${{ matrix.jetpack }}'
          if [[ "$jetpack_version" == latest ]]; then
            wp plugin install jetpack --path="$fresh_root" --activate
          else
            wp plugin install jetpack --version="$jetpack_version" --path="$fresh_root" --activate
          fi
          wp plugin install "$GITHUB_WORKSPACE/dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" --path="$fresh_root" --activate
          wp plugin is-active ran-turnstile-for-jetpack-forms --path="$fresh_root"

  plugin-check:
    name: Plugin Check v0.4.0
    needs: build
    if: needs.build.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Download the exact rebuilt release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0-4-0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Extract the rebuilt archive
        run: mkdir plugin-check-build && unzip -q "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" -d plugin-check-build

      - uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1
        with:
          build-dir: ./plugin-check-build/ran-turnstile-for-jetpack-forms
          wp-version: '7.0.3'
          ignore-codes: PluginCheck.CodeAnalysis.EnqueuedResourceOffloading.OffloadedContent

  publish:
    name: Publish exact missing v0.4.0 release
    needs: [build, compatibility, plugin-check]
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.compatibility.result == 'success' &&
          needs.plugin-check.result == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.path == '.github/workflows/quality.yml' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CURRENT_MAIN: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the qualified reconciliation assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0-4-0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Prove the exact historical release identity before mutation
        id: preflight
        run: |
          set -euo pipefail

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}")"
          jq -e \
            --arg head "$RELEASE_PR_HEAD" \
            --arg merge "$SOURCE_COMMIT" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.number == 8 and .merged_at != null and .base.ref == "main" and .head.sha == $head and .merge_commit_sha == $merge and .head.ref == "release-please--branches--main--components--ran-turnstile-for-jetpack-forms" and .head.repo.full_name == $repository and .user.login == "github-actions[bot]" and .title == "chore(main): release 0.4.0"' \
            <<< "$pr" >/dev/null

          source_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_COMMIT}")"
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_PR_HEAD}")"
          test "$(jq -er '.commit.tree.sha' <<< "$source_commit")" = "$(jq -er '.commit.tree.sha' <<< "$pr_head")"

          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_COMMIT}...${CURRENT_MAIN}")"
          jq -e --arg source "$SOURCE_COMMIT" '.merge_base_commit.sha == $source and (.status == "ahead" or .status == "identical")' <<< "$comparison" >/dev/null

          current_manifest="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${CURRENT_MAIN}" --jq '.content' |
              tr -d '\n' |
              base64 --decode
          )"
          test "$(jq -er '."."' <<< "$current_manifest")" = "$VERSION"

          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}" --jq '[.labels[].name]')"
          jq -e 'index("autorelease: pending") != null and index("autorelease: tagged") == null' <<< "$labels" >/dev/null

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::${TAG_NAME} already exists; refusing one-time reconciliation."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${TAG_NAME} already exists; refusing one-time reconciliation."
            exit 1
          fi

          archive="dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip"
          checksum="${archive}.sha256"
          manifest="dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          jq -e \
            --arg archive "$(basename "$archive")" \
            --arg commit "$SOURCE_COMMIT" \
            --arg sha256 "$archive_sha256" \
            --arg tag "$TAG_NAME" \
            --arg version "$VERSION" \
            '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
            "$manifest" >/dev/null
          printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          unzip -tqq "$archive"

          notes="$(jq -r '.body' <<< "$pr" | awk 'BEGIN { emit = 0 } /^## \[0\.4\.0\]/ { emit = 1 } emit && /^---$/ { exit } emit')"
          test -n "$notes"
          printf '%s\n' "$notes" > release-notes.md

      - name: Create the exact draft release and upload qualified assets
        id: release
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            --draft \
            --target "$SOURCE_COMMIT" \
            --title "$TAG_NAME" \
            --notes-file release-notes.md \
            --repo "$GITHUB_REPOSITORY"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"
          jq -e --arg commit "$SOURCE_COMMIT" --arg tag "$TAG_NAME" '.tag_name == $tag and .target_commitish == $commit and .draft == true' <<< "$release_json" >/dev/null
          release_id="$(jq -er '.id' <<< "$release_json")"

          for asset in \
            "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
            "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256" \
            "dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json"; do
            asset_name="$(basename "$asset")"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@${asset}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}" \
              >/dev/null
          done

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -f make_latest=true \
            >/dev/null
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Read back the exact publication and reconcile Release Please state
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e \
            --arg commit "$SOURCE_COMMIT" \
            --arg tag "$TAG_NAME" \
            --argjson release_id "$RELEASE_ID" \
            '.id == $release_id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false' \
            <<< "$release_json" >/dev/null

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"
          jq -e --arg commit "$SOURCE_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref" >/dev/null

          expected_names="$(
            printf '%s\n' \
              "ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json" \
              "ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
              "ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256" |
              jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
          )"
          test "$(jq -c '[.assets[].name] | sort' <<< "$release_json")" = "$expected_names"

          local_digests="$(
            for asset in \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json" \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256"; do
              jq -nc --arg name "$(basename "$asset")" --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" '{name: $name, digest: $digest}'
            done |
              jq -sc 'sort_by(.name)'
          )"
          remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
          test "$remote_digests" = "$local_digests"

          jq -nc '{labels: ["autorelease: tagged"]}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}/labels" --input - >/dev/null
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}/labels/autorelease%3A%20pending" >/dev/null

          labels_after="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}" --jq '[.labels[].name]')"
          jq -e 'index("autorelease: tagged") != null and index("autorelease: pending") == null' <<< "$labels_after" >/dev/null
