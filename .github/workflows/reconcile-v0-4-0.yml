name: Reconcile v0.4.0 publication

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: reconcile-v0-4-0-publication
  cancel-in-progress: false

env:
  TAG_NAME: v0.4.0
  VERSION: 0.4.0
  SOURCE_COMMIT: 89e9ef33dda3356c644ad094abafb1ac2faf63e0
  RELEASE_PR: '8'
  RELEASE_PR_HEAD: 061aa2911ac8c610740553be5a4152a59072e12d

jobs:
  build:
    name: Rebuild exact v0.4.0 source
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.path == '.github/workflows/quality.yml' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {}
    steps:
      - name: Check out the exact historical merge without repository credentials
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(jq -er '."."' .release-please-manifest.json)" = "$VERSION"
          test "$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' ran-turnstile-for-jetpack-forms.php)" = "$VERSION"
          test "$(jq -r '.enabled' wordpress-org/deployment.json)" = false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        id: php
        continue-on-error: true
        timeout-minutes: 3
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2, wp-cli
          coverage: none

      - name: Retry the bounded PHP setup once
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        timeout-minutes: 3
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer:v2, wp-cli
          coverage: none

      - name: Requalify historical source and build canonical assets
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          composer validate --strict
          composer run phpcs
          find . -path './vendor' -prune -o -type f -name '*.php' -exec php -l {} \;
          node --check assets/turnstile.js
          node --check scripts/make-pot.mjs
          node scripts/make-pot.mjs
          git diff --exit-code -- languages/ran-turnstile-for-jetpack-forms.pot

          bash scripts/create-release-assets.sh "$TAG_NAME"
          archive="dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip"
          checksum="${archive}.sha256"
          manifest="dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"

          jq -e \
            --arg archive "$(basename "$archive")" \
            --arg commit "$SOURCE_COMMIT" \
            --arg sha256 "$archive_sha256" \
            --arg tag "$TAG_NAME" \
            --arg version "$VERSION" \
            '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
            "$manifest" >/dev/null
          printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          unzip -tqq "$archive"

      - name: Upload exact reconciliation assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ran-turnstile-v0-4-0-reconciliation-${{ github.run_id }}
          path: |
            dist/ran-turnstile-for-jetpack-forms-0.4.0.zip
            dist/ran-turnstile-for-jetpack-forms-0.4.0.zip.sha256
            dist/ran-turnstile-for-jetpack-forms-0.4.0.manifest.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }} / Jetpack ${{ matrix.jetpack }}
    needs: build
    if: needs.build.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions: {}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wordpress: '6.5'
            jetpack: '13.3.1'
          - php: '8.5'
            wordpress: latest
            jetpack: latest
    steps:
      - name: Check out exact historical source without repository credentials
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        id: php
        continue-on-error: true
        timeout-minutes: 3
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, zip
          tools: composer:v2, wp-cli

      - name: Retry the bounded PHP setup once
        if: steps.php.outcome == 'failure'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        timeout-minutes: 3
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, zip
          tools: composer:v2, wp-cli

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download the exact rebuilt release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0-4-0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Verify historical archive identity
        run: |
          set -euo pipefail
          archive="dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip"
          manifest="dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json"
          test "$(jq -er '.commit' "$manifest")" = "$SOURCE_COMMIT"
          test "$(jq -er '.version' "$manifest")" = "$VERSION"
          test "$(jq -er '.tag' "$manifest")" = "$TAG_NAME"
          (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
          unzip -tqq "$archive"

      - name: Install WordPress test suite
        run: bash scripts/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}

      - name: Run WordPress integration tests
        run: WP_TESTS_DIR=/tmp/wordpress-tests-lib composer run test

      - name: Install and activate the rebuilt release ZIP in fresh WordPress
        run: |
          fresh_root="/tmp/ran-turnstile-v0-4-0-${{ matrix.php }}"
          wp_version='${{ matrix.wordpress }}'
          if [[ "$wp_version" == latest ]]; then
            wp core download --path="$fresh_root"
          else
            wp core download --path="$fresh_root" --version="$wp_version"
          fi
          wp config create --path="$fresh_root" --dbname=ran_turnstile_reconcile --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp db create --path="$fresh_root"
          wp core install --path="$fresh_root" --url=http://localhost --title='RAN Turnstile v0.4.0 reconciliation' --admin_user=admin --admin_password=release-test-password --admin_email=admin@example.test
          jetpack_version='${{ matrix.jetpack }}'
          if [[ "$jetpack_version" == latest ]]; then
            wp plugin install jetpack --path="$fresh_root" --activate
          else
            wp plugin install jetpack --version="$jetpack_version" --path="$fresh_root" --activate
          fi
          wp plugin install "$GITHUB_WORKSPACE/dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" --path="$fresh_root" --activate
          wp plugin is-active ran-turnstile-for-jetpack-forms --path="$fresh_root"

  plugin-check:
    name: Plugin Check v0.4.0
    needs: build
    if: needs.build.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      PLUGIN_CHECK_CORE_REF: WordPress/WordPress#7.0.3
      PLUGIN_CHECK_SLUG: ran-turnstile-for-jetpack-forms
      PLUGIN_CHECK_WP_ENV_VERSION: 11.13.0
    steps:
      - name: Initialize Plugin Check evidence files
        run: |
          : > "${{ runner.temp }}/plugin-check-results-raw.txt"
          : > "${{ runner.temp }}/plugin-check-results-filtered.txt"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the exact rebuilt release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0-4-0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Extract the rebuilt archive
        run: mkdir plugin-check-build && unzip -q "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" -d plugin-check-build

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install the pinned wp-env runtime
        run: |
          npm --global --no-fund --no-audit install "@wordpress/env@${PLUGIN_CHECK_WP_ENV_VERSION}"
          test "$(npm --global list @wordpress/env --depth=0 --json | jq -er '.dependencies["@wordpress/env"].version')" = "$PLUGIN_CHECK_WP_ENV_VERSION"

      - name: Configure WordPress 7.0.3 for Plugin Check
        env:
          PLUGIN_DIR: ${{ github.workspace }}/plugin-check-build/ran-turnstile-for-jetpack-forms
        run: |
          jq -n \
            --arg core "$PLUGIN_CHECK_CORE_REF" \
            --arg path "$PLUGIN_DIR" \
            --arg slug "$PLUGIN_CHECK_SLUG" \
            '{core: $core, port: 8880, testsEnvironment: false, mappings: {("wp-content/plugins/" + $slug): $path}}' > .wp-env.json
          test "$(jq -er '.core' .wp-env.json)" = "$PLUGIN_CHECK_CORE_REF"

      - name: Start the pinned Plugin Check environment
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if wp-env start --update && wp-env run cli wp cli info; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            wp-env destroy --force || true
          done

      - name: Run Plugin Check and enforce scoped Turnstile acceptance
        timeout-minutes: 10
        env:
          RAW_RESULTS_FILE: ${{ runner.temp }}/plugin-check-results-raw.txt
          FILTERED_RESULTS_FILE: ${{ runner.temp }}/plugin-check-results-filtered.txt
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}/plugin-check-build/ran-turnstile-for-jetpack-forms
        run: |
          set -euo pipefail
          wp-env run cli wp plugin install plugin-check --activate
          dependencies="$(wp-env run cli wp plugin get "$PLUGIN_CHECK_SLUG" --field=requires_plugins | tr ',' ' ')"
          if [[ -n "$dependencies" ]]; then
            # WordPress owns these dependency slugs; word splitting is intentional.
            # shellcheck disable=SC2086
            wp-env run cli wp plugin install --activate $dependencies
          fi
          wp-env run cli wp plugin activate "$PLUGIN_CHECK_SLUG"

          set +e
          wp-env run cli wp plugin check "$PLUGIN_CHECK_SLUG" \
            --format=json \
            --require=./wp-content/plugins/plugin-check/cli.php > "$RAW_RESULTS_FILE"
          plugin_check_status=$?
          set -e

          cat "$RAW_RESULTS_FILE"
          if [[ "$plugin_check_status" -ne 0 && ! -s "$RAW_RESULTS_FILE" ]]; then
            exit "$plugin_check_status"
          fi

          log_token="$(openssl rand -hex 32)"
          printf '::stop-commands::%s\n' "$log_token"
          filter_status=0
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/scripts/filter-plugin-check-results.mjs,dst=/filter.mjs,readonly" \
            --mount "type=bind,src=$RAW_RESULTS_FILE,dst=/raw.txt,readonly" \
            --mount "type=bind,src=$PLUGIN_SOURCE_ROOT,dst=/source,readonly" \
            node:24-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e \
            node /filter.mjs /raw.txt - /source > "$FILTERED_RESULTS_FILE" || filter_status=$?
          printf '::%s::\n' "$log_token"
          exit "$filter_status"

      - name: Upload Plugin Check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0-4-0-plugin-check-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plugin-check-results-raw.txt
            ${{ runner.temp }}/plugin-check-results-filtered.txt
          if-no-files-found: error

      - name: Destroy the pinned Plugin Check environment
        if: always()
        run: wp-env destroy --force

  publish:
    name: Publish exact missing v0.4.0 release
    needs: [build, compatibility, plugin-check]
    if: >-
      ${{ always() &&
          needs.build.result == 'success' &&
          needs.compatibility.result == 'success' &&
          needs.plugin-check.result == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.path == '.github/workflows/quality.yml' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CURRENT_MAIN: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the qualified reconciliation assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ran-turnstile-v0-4-0-reconciliation-${{ github.run_id }}
          path: dist

      - name: Prove exact historical identity and safe resumable state
        id: preflight
        run: |
          set -euo pipefail

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}")"
          jq -e \
            --arg head "$RELEASE_PR_HEAD" \
            --arg merge "$SOURCE_COMMIT" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.number == 8 and .merged_at != null and .base.ref == "main" and .head.sha == $head and .merge_commit_sha == $merge and .head.ref == "release-please--branches--main--components--ran-turnstile-for-jetpack-forms" and .head.repo.full_name == $repository and .user.login == "github-actions[bot]" and .title == "chore(main): release 0.4.0"' \
            <<< "$pr" >/dev/null

          source_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_COMMIT}")"
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_PR_HEAD}")"
          test "$(jq -er '.commit.tree.sha' <<< "$source_commit")" = "$(jq -er '.commit.tree.sha' <<< "$pr_head")"

          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_COMMIT}...${CURRENT_MAIN}")"
          jq -e --arg source "$SOURCE_COMMIT" '.merge_base_commit.sha == $source and (.status == "ahead" or .status == "identical")' <<< "$comparison" >/dev/null

          current_manifest="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${CURRENT_MAIN}" --jq '.content' |
              tr -d '\n' |
              base64 --decode
          )"
          test "$(jq -er '."."' <<< "$current_manifest")" = "$VERSION"

          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}" --jq '[.labels[].name]')"
          jq -e 'index("autorelease: pending") != null or index("autorelease: tagged") != null' <<< "$labels" >/dev/null

          archive="dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip"
          checksum="${archive}.sha256"
          manifest="dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          jq -e \
            --arg archive "$(basename "$archive")" \
            --arg commit "$SOURCE_COMMIT" \
            --arg sha256 "$archive_sha256" \
            --arg tag "$TAG_NAME" \
            --arg version "$VERSION" \
            '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
            "$manifest" >/dev/null
          printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
          (cd dist && sha256sum --check --strict "$(basename "$checksum")")
          unzip -tqq "$archive"

          tag_exists=false
          if tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" 2>/dev/null)"; then
            tag_exists=true
            jq -e --arg commit "$SOURCE_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref" >/dev/null
          fi

          release_exists=false
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" 2>/dev/null)"; then
            release_exists=true
            jq -e --arg commit "$SOURCE_COMMIT" --arg tag "$TAG_NAME" '.tag_name == $tag and .target_commitish == $commit and .prerelease == false' <<< "$release_json" >/dev/null
            test "$tag_exists" = true

            expected_names="$(
              printf '%s\n' \
                "ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json" \
                "ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
                "ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256" |
                jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
            )"
            jq -e --argjson expected "$expected_names" '([.assets[].name] - $expected) | length == 0' <<< "$release_json" >/dev/null
            jq -e '([.assets[].name] | length) == ([.assets[].name] | unique | length)' <<< "$release_json" >/dev/null
          fi

          printf 'release-exists=%s\ntag-exists=%s\n' "$release_exists" "$tag_exists" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$(jq -r '.body' <<< "$pr" | awk 'BEGIN { emit = 0 } /^## \[0\.4\.0\]/ { emit = 1 } emit && /^---$/ { exit } emit')" > release-notes.md
          test -s release-notes.md

      - name: Create or resume the exact release and attach qualified assets
        id: release
        env:
          RELEASE_EXISTS: ${{ steps.preflight.outputs.release-exists }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_EXISTS" != true ]]; then
            gh release create "$TAG_NAME" \
              --draft \
              --target "$SOURCE_COMMIT" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"
          jq -e --arg commit "$SOURCE_COMMIT" --arg tag "$TAG_NAME" '.tag_name == $tag and .target_commitish == $commit and .prerelease == false' <<< "$release_json" >/dev/null
          release_id="$(jq -er '.id' <<< "$release_json")"

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"
          jq -e --arg commit "$SOURCE_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref" >/dev/null

          expected_names="$(
            printf '%s\n' \
              "ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json" \
              "ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
              "ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256" |
              jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
          )"
          local_digests="$(
            for asset in \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json" \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256"; do
              jq -nc --arg name "$(basename "$asset")" --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" '{name: $name, digest: $digest}'
            done |
              jq -sc 'sort_by(.name)'
          )"
          remote_names="$(jq -c '[.assets[].name] | sort' <<< "$release_json")"
          remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
          assets_exact=false
          if [[ "$remote_names" == "$expected_names" && "$remote_digests" == "$local_digests" ]]; then
            assets_exact=true
          fi

          if [[ "$assets_exact" != true ]]; then
            if [[ "$(jq -r '.immutable // false' <<< "$release_json")" == true ]]; then
              echo '::error::Existing immutable release does not already contain the exact qualified assets.'
              exit 1
            fi

            jq -e --argjson expected "$expected_names" '([.assets[].name] - $expected) | length == 0' <<< "$release_json" >/dev/null
            jq -e '([.assets[].name] | length) == ([.assets[].name] | unique | length)' <<< "$release_json" >/dev/null

            for asset in \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256" \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json"; do
              asset_name="$(basename "$asset")"
              existing_asset_id="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .id' <<< "$release_json")"
              if [[ -n "$existing_asset_id" ]]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}" >/dev/null
              fi
              curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                -H 'Content-Type: application/octet-stream' \
                --data-binary "@${asset}" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}" \
                >/dev/null
            done
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          if [[ "$(jq -r '.draft' <<< "$release_json")" == true ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false \
              -f make_latest=true \
              >/dev/null
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Read back exact publication and reconcile Release Please state
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          expected_names="$(
            printf '%s\n' \
              "ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json" \
              "ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
              "ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256" |
              jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
          )"
          local_digests="$(
            for asset in \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.manifest.json" \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip" \
              "dist/ran-turnstile-for-jetpack-forms-${VERSION}.zip.sha256"; do
              jq -nc --arg name "$(basename "$asset")" --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" '{name: $name, digest: $digest}'
            done |
              jq -sc 'sort_by(.name)'
          )"

          verified=false
          for delay in 0 2 2 2 2; do
            sleep "$delay"
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
            tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}")"

            if jq -e \
              --arg commit "$SOURCE_COMMIT" \
              --arg tag "$TAG_NAME" \
              --argjson release_id "$RELEASE_ID" \
              '.id == $release_id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false and .immutable == false' \
              <<< "$release_json" >/dev/null \
              && jq -e --arg commit "$SOURCE_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref" >/dev/null \
              && [[ "$(jq -c '[.assets[].name] | sort' <<< "$release_json")" == "$expected_names" ]] \
              && [[ "$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")" == "$local_digests" ]]; then
              verified=true
              break
            fi
          done
          test "$verified" = true

          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}" --jq '[.labels[].name]')"
          if ! jq -e 'index("autorelease: tagged") != null' <<< "$labels" >/dev/null; then
            jq -nc '{labels: ["autorelease: tagged"]}' |
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}/labels" --input - >/dev/null
          fi
          if jq -e 'index("autorelease: pending") != null' <<< "$labels" >/dev/null; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}/labels/autorelease%3A%20pending" >/dev/null
          fi

          labels_after="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RELEASE_PR}" --jq '[.labels[].name]')"
          jq -e 'index("autorelease: tagged") != null and index("autorelease: pending") == null' <<< "$labels_after" >/dev/null
